<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG IN PAGE</title>
    <script src="index.js" defer></script>
    <style>
        .name {
            background-color: rgb(255, 255, 255,0.7);
            height: 500px;
            width:400px;
            font-size: larger;
            color: black;
            border: none;
            border-radius: 20px;
            box-shadow: inset 20px 20px 20px rgb(138, 43, 226,0.6);
            display: flex;
            justify-content: center;
            flex-direction: column;
            margin-top: 50px;
        }
            p{
               
                color: blue;
            }
            body{
                background-image: url("https://i.pinimg.com/originals/14/ab/0a/14ab0af50a9f9f3bd334dbc2dc8e4139.jpg");
                background-repeat: no-repeat;
                background-size: cover;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
            }
            input{
                width: 300px;
                height: 30px;
                border-radius: 20px;

            }
            h4{
                margin-left: 150px;
                font-size: x-large;
            }
            h3{
                margin-left: 100px;
            }
        .none{
            margin-left: 50px;
        }
        button{
            height: 50PX;
            width: 100PX;
            background-color: rgb(127, 255, 0,0.5);
            border-radius: 20PX;
            margin-left: 150PX;
            margin-top: 50PX;
        }
        button:hover{
            background-color: rgb(0, 0, 255,0.4);
            height: 45PX;
        }
         input:hover{
            height: 29PX;
            text-decoration: underline none;
        }
         .name:hover{
            background-color: rgb(239, 239, 245,0.5);
        }
    </style>
</head>
<body>
    
    <div class="name">
        <h4>LOG IN</h4>
        <div class="none">
        <h3>Your name</h3>
        <input type="text" id="username" placeholder="enter your name">
        </div>
        <button onclick="log()">LOG IN</button>
        <p id="word"></p>
    </div>
    <script>
       function log(){
         let user=document.getElementById("username").value;
         document.getElementById("username").value=""
         if(user.trim().toLowerCase()==="mugisha aime"){
            window.location.href="log.html"
         }
         else{
             localStorage.setItem("userName",user)
            window.location.href="other.html"
            
         }
       }
document.body.style.overflow = "hidden";

window.addEventListener("wheel", e => e.preventDefault(), { passive: false });
window.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
window.addEventListener("keydown", function(e){
  const keys = ["ArrowDown","ArrowUp","PageDown","PageUp"," "];
  if(keys.includes(e.key)) e.preventDefault();
});
    </script>
    
</body>
</html>
