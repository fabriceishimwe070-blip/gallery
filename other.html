<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALLERY</title>
</head>
<link rel="stylesheet" href="index.css">

    <style>
        html, body {
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100%;
        }
        h3{
            color: blue;
            font-size: 25px;
        }
        .mar{
            width: 900px;
        }
        span{
            color: blue;
        }
    </style>
<body>
     <div class="main">
    <div class="mar"><marquee behavior="40" direction="right"><h3 id="name"></h3></marquee></div>
 <header><a href="index.html">Log out</a></header>
 </div>
<div id="container"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    let name=document.getElementById("name")
    let user=localStorage.getItem("userName")
    name.textContent=` Well come,${user}🫴`

const firebaseConfig = {
  apiKey: "AIzaSyCQndLrBgmX1g2jzO47RbUy4CK9quLkQRU",
  authDomain: "gallery-2c722.firebaseapp.com",
  projectId: "gallery-2c722"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function put(){
    let container = document.getElementById("container");

    db.collection("images").onSnapshot(snapshot => {
        container.innerHTML = "";

        snapshot.forEach(doc => {

            let data = doc.data();

            let box = document.createElement("div");
            box.style.position = "relative";
            box.style.display = "inline-block";
            box.style.margin = "10px";
            box.style.textAlign = "center";

            let img = document.createElement("img");
            img.src = data.url;
            img.width = 200;

            let enlargeBtn = document.createElement("button");
            enlargeBtn.textContent = "View";
            enlargeBtn.style.position = "absolute";
            enlargeBtn.style.top = "50%";
            enlargeBtn.style.left = "50%";
            enlargeBtn.style.transform = "translate(-50%, -50%)";

            enlargeBtn.onclick = function(){
                img.width = (img.width === 200) ? 700 : 200;
            }

            let button = document.createElement("button");
            button.style.display = "block";
            button.style.margin = "10px auto";
            button.style.border = "none";
            button.style.color = "green";
            button.style.backgroundColor = "black";
            button.style.fontSize = "medium";
            button.style.fontWeight = "bolder";

            button.onclick = function(){
                db.collection("images").doc(doc.id).delete();
            }

            box.appendChild(img);
            box.appendChild(enlargeBtn);
            box.appendChild(button);

            container.appendChild(box);
        });
    });
}

window.onload = function(){
    put();
}

</script>

</body>
</html>
